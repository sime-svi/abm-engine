# Configuración de la fase «terreno» (incrementos 1 a 4). TODOS los parámetros viven aquí (CLAUDE §5).
# Los defaults son los del documento madre REESCALADOS al tick diario (T_anio=365): toda tasa por
# tick × 48/365, toda cadencia en ticks × 365/48 (diseño §7).

[run]
name        = "terreno"    # nombre legible => nombre del JSON de salida
seed        = 42           # semilla del RNG raíz. (seed, config) => mundo reproducible
total_ticks = 365          # ticks a simular (1 año con el tick diario)
output_path = "output"     # carpeta destino (ignorada por git)
dump_world  = false         # true => vuelca además un snapshot por celda del mundo generado
genesis_cache = "output/cache" # caché de la génesis ("" = sin caché): se calcula una vez por (semilla, config, código)

[planet]
r_km      = 6371.0         # radio del planeta (km)
n0        = 48             # celdas por arista de cara en L=0 (6·n0² celdas totales)
sea_level = 0.0            # cota por debajo de la cual hay océano (m)
h_min     = -11000.0       # elevación mínima (m)
h_max     = 9000.0         # elevación máxima (m)

[worldgen]
noise_octaves      = 6        # octavas del ruido de elevación (detalle)
persistence        = 0.5      # peso decreciente de cada octava
lacunarity         = 2.0      # subida de frecuencia por octava
base_freq          = 1.6      # frecuencia base (nº de continentes ~)
octaves_per_level  = 1        # octavas extra por cada nivel LOD sobre l_min (detalle fino al afinar)
land_exp           = 3.0      # exponente hipsométrico (>1 => domina la tierra baja); solo con relieve = "ruido"
river_threshold_km2 = 80000.0 # área de drenaje mínima para ser río (km²)
resource_density   = 0.05     # fracción de celdas de tierra con depósito de recurso
relieve            = "tectonico" # "tectonico" (incremento 4, deriva de placas) o "ruido" (incrementos 1–3). Interruptor mientras se mide

[climate]
t_equator         = 30.0   # temperatura media en el ecuador a nivel del mar (°C)
k_lat             = 0.6     # caída de temperatura por grado de latitud (°C/°)
lapse             = 6.5     # gradiente térmico vertical (°C/km)
seas_amp_pole     = 25.0    # amplitud estacional máxima (en el polo) (°C)
t_year            = 365.0   # duración del año (ticks). >= 24 (anti-aliasing)
t_freeze          = 0.0     # umbral de congelación lluvia→nieve (°C)
k_melt            = 0.26    # fusión de nieve por grado (mm/(°C·tick)) [2·48/365]
p_ref             = 5.0     # precipitación de referencia (mm/tick). Calibrada (>2.6 reescalado) para selva
k_oro             = 40.0    # sensibilidad orográfica: valor físico (nota de sombra pluviométrica §7; el relieve, no k_oro, es lo que hay que hacer realista)
m_oro_min         = 0.2     # factor orográfico mínimo (sotavento seco)
m_oro_max         = 3.0     # factor orográfico máximo (barlovento húmedo)
moisture_length_km = 1500.0 # escala de secado tierra adentro (km)
d_oro_km          = 25.0    # escala (km) a la que la lluvia "ve" el relieve (nota de lluvia orográfica); >= 10
seas_precip_amp   = 0.0     # amplitud de la modulación estacional de lluvia (0 = suave)
# Sombra pluviométrica extensa (nota de sombra pluviométrica §3): el aire que sube una cordillera
# suelta su vapor y no lo recupera al bajar. w = exp(-Λ/h_v), con Λ la altura de saturación del aire:
# sube cuando el terreno supera lo que el aire ya subió y se recarga sobre tierra con l_recarga_km
# (camino del viento hacia atrás, en pasos de d_oro, hasta el mar o l_traj_km). El aire ve el mar plano.
h_v_m             = 2500.0  # subida que deja al aire con ~37 % de su vapor (m)
l_recarga_km      = 3000.0  # distancia de recarga de humedad sobre tierra (km; decisión S2)
l_traj_km         = 2000.0  # longitud máxima del camino hacia atrás (km)
tol_lluvia        = 0.05    # si orografía y agotamiento desvían la lluvia total sobre tierra más de esto, factor c_P (provisional, CLAUDE §2.8)

[soil]
runoff_base = 0.10         # coeficiente base de escorrentía
k_slope     = 0.5          # sensibilidad de la escorrentía a la pendiente
k_sat       = 0.4          # sensibilidad de la escorrentía a la saturación
k_et        = 0.13         # evapotranspiración por grado (mm/(°C·tick)) [1.0·48/365]
k_lat_flow  = 0.0066       # difusión lateral de humedad [0.05·48/365]
w_cap_min   = 50.0         # capacidad de campo mínima (mm)
w_cap_max   = 300.0        # capacidad de campo máxima (mm)
# Suelo vivo (incremento 3). Tasas por AÑO, no por tick.
z_init      = 1.0          # profundidad de suelo inicial (m); con z = z_init, capacidad = la de la textura
k_weath     = 1e-4         # meteorización máxima: roca -> suelo (m/año). Calibrado: rango real 1e-5..1e-4
z_ref       = 0.5          # profundidad de referencia: con más suelo, se forma más despacio (m)
t_ref       = 15.0         # temperatura de referencia de la meteorización (°C)
p_ref_soil  = 1000.0       # lluvia a partir de la cual la humedad ya no acelera la meteorización (mm/año)
z_root      = 1.5          # profundidad de raíces: más suelo no retiene más agua útil (m)
f_rock      = 0.3          # fracción de capacidad que conserva la roca desnuda en celdas del nivel 0 (calibrado)
f_rock_beta = 0.5          # baja con el nivel: f_rock(L) = f_rock · 2^(−f_rock_beta·L) (30 % en L0, ~11 % en L3)

[vegetation]
theta_opt   = 0.6          # humedad óptima
sigma_theta = 0.25         # tolerancia de humedad
t_opt       = 22.0         # temperatura óptima (°C)
sigma_t     = 12.0         # tolerancia de temperatura (°C)
k_max       = 100.0        # capacidad de carga máxima
r_veg       = 0.026        # tasa de crecimiento vegetal (1/tick) [0.2·48/365]
n_veg       = 30           # cadencia de vegetación (ticks) [4·365/48]
v_init      = 1.0          # biomasa inicial de la tierra (y de la tierra nueva que descubre el LOD)

[lod]
# LOD dinámico (incremento 2): la malla se subdivide donde hay detalle y se colapsa donde no.
l_min           = 0        # nivel base uniforme (antes planet.l_unif)
l_max           = 3        # nivel máximo; l_max = l_min => LOD apagado (malla uniforme del incr. 1)
n_lod           = 60       # cada cuántos ticks se revisa la malla
dh_sub          = 500.0    # m: diferencia de altura con un vecino de tierra que pide subdividir
dt_sub          = 4.0      # °C: ídem temperatura
dtheta_sub      = 0.3      # ídem humedad relativa del suelo (0..1)
h_hist          = 0.5      # histéresis: solo se colapsa por debajo de h_hist · umbral
refine_features = true     # afinar costas, ríos y lagos
max_sub_frac    = 0.02     # tope de subdivisiones por revisión (fracción de las celdas; 0 = sin tope)

[erosion]
# Relieve vivo (incremento 3): los ríos excavan, el sedimento rellena hondonadas, las laderas se
# suavizan. Tasas por AÑO. Antes del tick 0 se "envejece" el planeta (génesis geológica); durante la
# simulación la erosión sigue a ritmo real (casi imperceptible en pocos años).
geo_steps    = 200         # pasos de la génesis geológica (0 = sin génesis)
geo_dt_years = 5000.0      # años por paso (200 × 5000 = 1 millón de años)
geo_rounds   = 2           # rondas erosión <-> refinado de la malla
k_ero        = 1e-6        # erodibilidad K de la potencia de arroyo (caudal en m³/año)
m_ero        = 0.5         # exponente del caudal (el de la pendiente es 1)
kappa_dif    = 10.0        # difusividad de ladera efectiva (m²/año)
run_every    = 365         # cada cuántos ticks se erosiona durante la simulación (0 = nunca)
run_accel    = 1.0         # acelerador del tiempo geológico en la simulación (1 = realista)

[tectonica]
# Relieve tectónico (incremento 4): deriva de placas antes de la génesis geológica. Diseño del
# responsable: docs/design/terreno/diseno_relieve_tectonico.md; técnico: incremento-4-diseno.md.
# Valores físicos medidos por defecto (CLAUDE §2.8); se calibran solo los que no se pueden medir,
# contra un resultado observado (c_b → velocidad de las placas; c_col → choque India–Asia).
# Planeta y agua (§5.1)
gel_m        = 2617.0      # agua del océano actual / superficie (m), sin el agua del hielo (no hay casquetes)
f_cont       = 0.40        # corteza continental al empezar la deriva; el valor final es un resultado
# Corteza e isostasia (§5.2, con la corrección C1: bajo el agua flota con (ρ_m − ρ)/(ρ_m − ρ_w))
rho_c        = 2800.0      # kg/m³
rho_m        = 3300.0
rho_oc       = 2900.0      # corteza oceánica (flotación de los arcos)
rho_w        = 1030.0      # agua de mar
rho_s        = 2400.0      # sedimento compactado de los márgenes (corrección C2)
h_oc_km      = 7.0
h0_km        = 35.0        # corteza continental estable (± sigma_h0_km de ruido suave)
sigma_h0_km  = 3.0
h_nivel_km   = 32.0        # espesor continental que queda al nivel del mar (relación empírica)
h_cont_min_km = 20.0       # un arco oceánico más grueso pasa a continental
# Fondo oceánico (Parsons y Sclater, 1977; §5.3)
d_r_m        = 2500.0
c_hs         = 350.0
d_inf_m      = 6400.0
a_pl_m       = 3200.0
tau_pl_myr   = 62.8
t_x_myr      = 20.0
d_fosa_m     = 3000.0
w_fosa_km    = 50.0
# Bordes de placa (§5.4)
d_arco_km    = 200.0
w_arco_km    = 150.0
# Balance de la corteza continental (adenda_balance_corteza.md §5; "medido" no se toca)
p_arc_oc     = 1.2         # km³ por km² de placa que se hunde, arco oceánico (medido: Clift et al. 2009)
p_arc_cont   = 0.8         # ídem, arco sobre margen continental (medido: Clift et al. 2009)
p_se         = 0.4         # erosión por subducción por km² que se hunde (medido: 1,3–1,7 AU / 2,7–3,4 km²/año)
v_ero_cm_anio = 6.0        # margen erosivo si converge más rápido... (medido: Clift y Vannucchi 2004)
s_ero_km     = 1.0         # ...y le llega menos sedimento (medido: Clift y Vannucchi 2004)
f_acr        = 0.2         # fracción del sedimento de fosa que se pega al margen acrecionario (calibrado, 5 semillas: acrecionado/subducido 0,24; Tierra 0,3/1,0–1,65)
eta_col      = 0.5         # choque continente–continente: queda arriba (medido: India–Asia, ~50 %)
eta_arco     = 0.9         # choque arco–continente: queda arriba (medido: Luzón en Taiwán, ~90 %)
h_del_km     = 50.0        # la base de la corteza pasa a eclogita (físico: 1,2–1,5 GPa)
tau_del_myr  = 25.0        # delaminación del exceso (calibrado, 5 semillas con D_0 = 50: 0,71 AU frente a 0,46 con 50 Myr; India–Asia igual). Caída convectiva de una raíz: 10–30 Myr
h_flujo_km   = 50.0        # por encima, la corteza inferior caliente fluye hacia los lados (adenda v3 §6.6b; físico, 45–60)
d0_flujo_km2_myr = 50.0    # D_0 (adenda v6: D = D_0·(c/c_ref)³, c = h_c − h_flujo). Calibrado con India–Asia (70–80 km): 72 km a los 50 Myr (con 100, 69; con 1600, 61). ~2·10²⁰ Pa·s en un canal de 10 km (Clark y Royden 2000: 10¹⁸–10²¹)
c_ref_km     = 10.0        # espesor de canal de referencia (normalización, no física)
w_min_orog_km = 150.0
w_margen_km  = 150.0
f_rift       = 0.7
# Dinámica de placas (§5.5)
f_sp         = 1.0         # tirón de la placa (referencia de las fuerzas)
f_rp         = 0.2         # empuje de dorsal
t_sat_myr    = 80.0
c_col        = 90000.0     # calibrado: un choque frena la convergencia a 1/3 (India: 14,4 → 4,8–5,2 cm/año)
kappa_cont   = 3.0
v_obj_cm_anio = 4.39       # RMS de la litosfera, NNR-MORVEL56 (Argus et al., 2011)
recalibrar_myr = 50.0      # cada cuánto se recalibra c_b a v_obj
v_inicial_min_cm_anio = 1.0  # empujón inicial al azar en el rango real (decisión del responsable)
v_inicial_max_cm_anio = 10.0
# Bordes de placa (nota_bordes_placa.md §5)
theta_tr_grados = 20.0     # transformante a menos de 20° del desgarre puro (medido: separa las clases de Bird 2003)
l_borde_km   = 150.0       # radio del borde suavizado (calibrado contra los bordes de Bird; escala de flexión 100–300 km)
# Ciclo de vida de las fosas (nota_ciclo_fosas.md v2). W_dif, la franja de la convergencia difusa, es L_borde.
x_ini_km     = 150.0       # convergencia acumulada para que nazca una fosa (Gurnis et al. 2004: 100–150 km; Li y Gurnis 2023: ~200)
tau_muerte_myr = 10.0      # sin convergencia durante este tiempo, la fosa muere (supuesto)
lambda_esp   = 4.0e-6      # nacimiento espontáneo, ya solo en transformantes con contraste de edad (nota v4), por km y Myr y por 100 Myr de edad sobre a_min: raro (~0,2–0,6 por 100 Myr)
l_losa_km    = 800.0       # losa con la que el tirón es pleno (llega a 660 km con 45–60°; 660–1000)
a_min_myr    = 140.0       # edad mínima del fondo para un nacimiento espontáneo en una transformante (supuesto físico; 100–180)
v_inv_km_myr = 25.0        # una fosa se alarga desde su extremo por transformantes y márgenes pasivos (nota v4 §6.4). Calibrado, 5 semillas: la vida de los márgenes que acaban apenas cambia (91–124 Myr con 0–150) y es la más cercana a 130–180 con 25; Antillas Menores y Escocia, ~1 000–1 500 km en 40–50 Myr
a_inv_myr    = 60.0        # edad mínima del fondo que una fosa puede invadir (supuesto: Antillas Menores, fondo cretácico; 40–100)
t_rot_joven_myr = 10.0     # la losa se rompe tras un choque: a los 10 Myr si es joven... (van Hunen y Allen 2011)
t_rot_viejo_myr = 25.0     # ...y a los 25 si tiene 100 Myr o más
# Eventos de placas (§5.6)
n_p0         = 12
n_cratones   = 8
n_min        = 8
a_min_frac   = 0.005
tau_rift_myr = 150.0
v_rift_cm_anio = 2.0
v_sutura_cm_anio = 0.5
t_sutura_myr = 10.0
e1_km_myr    = 0.005       # erosión a 1 km sobre el mar (km/Myr; adenda v5 §6.7: E = E_1·(z/1 km)^n_ero). Calibrado con n_ero: relajación 135 Myr (100–200); exporta ~2,4 AU (5 semillas; objetivo ~1,8)
n_ero        = 2.5         # exponente de la erosión con la altura (rango 1,5–3; Montgomery y Brandon 2002). Con 3 exporta casi igual y las llanuras bajan de 1 m/Myr
deformacion  = 0.06        # deformación de bordes de Voronoi, cratones y líneas de rift (fracción del radio)
# Malla, tiempo y detalle (§5.7)
nivel_malla  = 2           # nivel del cubo del terreno (~52 km con n0 = 48; decisión del responsable)
dt_myr       = 1.0
t_deriva_myr = 500.0
t_rodaje_myr = 50.0        # tramo inicial que no cuenta para la validación
# Ruido de detalle: σ (m) según la altura isostática respecto al dato, que continúa el espectro real
# (ETOPO, nivel 2→3 por clase de altura; config/referencias/tierra_relieve.toml). Calibrado: ver incremento-4-diseno.md
detalle_cotas_m = [-5000.0, -3000.0, -1100.0, -100.0, 100.0, 350.0, 750.0, 1500.0, 2500.0, 4000.0]
detalle_sigma_m = [206.0, 332.0, 422.0, 100.0, 81.0, 108.0, 170.0, 235.0, 408.0, 325.0]
detalle_persistencia = 0.77 # razón de σ entre octavas sucesivas en ETOPO (niveles 1→2 y 2→3 de las clases de interior)
r_flex_km    = 100.0       # radio de flexión del rebote isostático de la erosión

[persistence]
sink = "json"              # destino de la salida (en este incremento solo JSON)
