# Proveedor de dashboards: Grafana carga los .json de la carpeta indicada al arrancar.
apiVersion: 1

providers:
  - name: ABM
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
