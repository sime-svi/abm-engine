services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: abm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Puerto del host configurable (infra/.env: PGPORT). 25432 por defecto: el 5432 y otros están
      # ocupados en esta máquina; dentro de la red de Docker la BD sigue en db:5432.
      - "${PGPORT:-25432}:5432"
    volumes:
      - abm-db-data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: abm-grafana
    ports:
      # Puerto del host configurable (infra/.env: GRAFANA_PORT). 23000 por defecto.
      - "${GRAFANA_PORT:-23000}:3000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - abm-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - db

# Red propia con subred fija, fuera de los rangos que Docker reparte por defecto (172.17-31.x,
# 192.168.x). Todas las instancias de WSL2 comparten la red del kernel: si otra instancia tiene una
# red de Docker con la misma subred (pasó con 172.18.0.0/16), el tráfico hacia los contenedores se
# pierde y ni la BD ni Grafana son alcanzables.
networks:
  default:
    ipam:
      config:
        - subnet: 10.88.42.0/24

volumes:
  abm-db-data:
  abm-grafana-data:
