# Workspace de Cargo (CLAUDE §3): un paquete ("crate") por responsabilidad. Las dependencias entre
# paquetes apuntan hacia `abm-core`, que no depende de ninguno de los demás.
[workspace]
resolver = "3"
members = [
    "crates/abm-core",
    "crates/abm-ruleset",
    "crates/abm-persistence",
    "crates/abm-metrics",
    "crates/abm-terreno",
    "crates/abm-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Paquetes del propio proyecto.
abm-core = { path = "crates/abm-core" }
abm-ruleset = { path = "crates/abm-ruleset" }
abm-persistence = { path = "crates/abm-persistence" }
abm-metrics = { path = "crates/abm-metrics" }
abm-terreno = { path = "crates/abm-terreno" }
# ECS standalone de Bevy (sin render). default-features = false quita el executor
# multihilo (feature `multi_threaded`): así el paralelismo no puede romper el determinismo.
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
# RNG determinista y portable entre versiones/plataformas (ChaCha8). Prohibido StdRng.
rand = "0.10"
rand_chacha = "0.10"
# Serialización de la config (TOML) y de la salida (JSON).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] } # lectura exacta de f64 (la caché de la génesis guarda su resumen en JSON)
toml = "1.1"
# Descompresión Deflate en Rust puro (modo Tierra: las tiras de los GeoTIFF de CHELSA y el gzip de CRU TS).
miniz_oxide = "0.8"
# Errores de librería.
thiserror = "2"
# Errores en el binario (solo abm-runner).
anyhow = "1"
postgres = { version = "0.19.14", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1.23.5", features = ["v4"] }
dotenvy = "0.15.7"
