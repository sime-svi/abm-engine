# Batería de escenarios de referencia (CLAUDE §10.5). La pasa `herramientas/escenarios.py`.
#
# Cada escenario es una corrida fija: un binario, su config de `config/` y unos ajustes `--set`
# encima. Se usa la config real, así que la batería ve el modelo tal y como está. Cada métrica
# tiene:
#   - medida:  el nombre de la función de `escenarios.py` (MEDIDAS), con sus parámetros;
#   - min/max: el margen;
#   - nota:    qué vigila y, cuando se sabe, el valor real de referencia.
#
# Los márgenes rodean el valor actual. No son objetivos de realismo: avisan cuando un cambio mueve
# algo que emerge al juntar sistemas. Si un cambio intencionado saca una métrica de su margen, se
# documenta en la nota de diseño del cambio y se actualiza aquí el margen, diciendo de dónde sale.
# Valores y márgenes medidos el 2026-11-05 (commit de las herramientas de escalabilidad).
#
# presupuesto_s: tiempo máximo de simulación del escenario (el que mide el binario en
# `<nombre>_tiempos.json`), con margen de sobra sobre esta máquina.

# ---------------------------------------------------------------------------------------------------
[[escenario]]
nombre = "planeta"
binario = "terreno"
descripcion = "el planeta por defecto (relieve tectónico, incremento 4), un año, con el volcado por celda para medir la sombra pluviométrica"
config = "config/terreno.toml"
ajustes = ["run.dump_world=true", "run.dump_climate=true"]
presupuesto_s = 200   # ~20 s con la génesis en caché; ~100 s si hay que recalcularla (deriva de 500 Myr: ~35 s)

# Márgenes del 2026-11-05 con el relieve tectónico (incremento 4; incremento-4-diseno.md §8). Se
# movieron a propósito al cambiar el relieve: el valor anterior (relieve de ruido) va en cada nota. La
# Tierra es la roca sin hielo con su rebote isostático, a 26 km (config/referencias/tierra_relieve.toml).
# Los márgenes rodean el valor actual: los que están lejos de la Tierra son hallazgos pendientes.

