[[escenario]]
nombre = "agentes_sequia"
binario = "agentes"
descripcion = "la config por defecto con una sequía (rebrote al 50 %) el año 21, 50 años"
config = "config/agentes.toml"
ajustes = ["run.total_ticks=18250", "habitat.sequia.inicio_dia=7300",
           "habitat.sequia.duracion_dias=365", "habitat.sequia.factor=0.5"]
presupuesto_s = 35   # ~11 s

[[escenario.metrica]]
medida = "agentes.caida"
especie = "herbivoro_70kg"
antes = 19
desde = 20
hasta = 30
min = 0.01
max = 0.06
nota = "población mínima del herbívoro tras la sequía frente a la de antes (0,027). Irreal: en las mortandades reales muere un 20-60 %. Es el hambre sincronizada (A5): subirá con la competencia con jerarquía"

[[escenario.metrica]]
medida = "agentes.hembras_adultas"
especie = "herbivoro_70kg"
anio = 21
min = 0.18
max = 0.35
nota = "fracción de hembras entre los adultos del herbívoro tras la sequía (0,25; antes de la revisión 1, 0 %)"

[[escenario.metrica]]
medida = "agentes.relativa"
especie = "herbivoro_70kg"
antes = 19
anio = 49
min = 0.20
max = 0.55
nota = "población del herbívoro 29 años después frente a la de antes de la sequía (0,37: se recupera despacio desde el 3 %)"

[[escenario.metrica]]
medida = "agentes.caida"
especie = "humano"
antes = 19
desde = 20
hasta = 30
min = 0.82
max = 0.93
nota = "población humana mínima tras la sequía frente a la de antes (0,88)"

